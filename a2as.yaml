variables:
  BASE_URL:
    type: env
    params:
      caller: [os.getenv]
      path: [_dotenv_path]
  GEMINI_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [_dotenv_path]
  MAX_DEFINITION_LENGTH:
    type: env
    params:
      caller: [os.getenv]
      path: [_dotenv_path]
  MODEL_NAME:
    type: env
    params:
      caller: [os.getenv]
      path: [_dotenv_path]
  QT_QPA_PLATFORM:
    type: env
    params:
      caller: [os.environ.get]
      path: [_dotenv_path]

files:
  .env:
    type: literal
    actions: [read]
    params:
      caller: [os.path.join]
      path: [_bundle_dir]
  file_path:
    type: variable
    actions: [write, read]
    params:
      caller: [open, os.path.exists, json.load]
      alias: [f]
  settings.json:
    type: literal
    actions: [read]
    params:
      caller: [os.path.join, Config.load]
      path: [bundle_dir]
